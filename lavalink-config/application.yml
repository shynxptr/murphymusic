server:
  port: 2333

lavalink:
  server:
    password: yournamelavalink
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      vimeo: true
      http: true
      twitch: true
      local: false

plugins:
  - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.2.0"
    repository: "https://jitpack.io"

lavasrc:
  providers:
    - "ytsearch:\"%ISRC%\""
    - "ytsearch:%QUERY%"
  spotify:
    clientId: ""
    clientSecret: ""
    countryCode: "US"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
